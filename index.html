<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NOSTALMANAC · 90s kid</title>
  <meta name="description" content="Cartoons, movies, songs, games, and fads. Tap play and live in the 90s.">
  <meta name="theme-color" content="#ff3d00">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://itunes.apple.com">
  <link rel="preconnect" href="https://en.wikipedia.org">
  <link rel="preconnect" href="https://api.tvmaze.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bangers&family=Outfit:wght@600;800&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=35">
</head>
<body data-vibe="toon">
  <audio id="bed" playsinline webkit-playsinline loop preload="auto" src="audio/silence.wav"></audio>
  <audio id="logon" playsinline webkit-playsinline preload="auto" src="audio/youve-got-nostalgia.wav"></audio>

  <div id="worlds" aria-hidden="true">
    <div class="world is-on" data-vibe="toon">
      <i class="crt-glass"></i>
      <i class="crt-scan"></i>
      <i class="crt-rgb"></i>
      <svg class="crt-snow" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <filter id="snow">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch">
            <animate attributeName="seed" values="0;20;7;31;4;18;0" dur="0.28s" repeatCount="indefinite"/>
          </feTurbulence>
          <feColorMatrix type="saturate" values="0"/>
        </filter>
        <rect width="100%" height="100%" filter="url(#snow)"/>
      </svg>
      <b class="sign">SATURDAY MORNING</b>
    </div>
    <div class="world" data-vibe="movie">
      <i class="curtain left"></i>
      <i class="curtain right"></i>
      <i class="neon-row"></i>
      <i class="aisle"></i>
      <i class="seats"></i>
      <b class="sign">NOW SHOWING</b>
    </div>
    <div class="world" data-vibe="jam">
      <i class="palm l"></i><i class="palm r"></i>
      <i class="squig a"></i><i class="squig b"></i><i class="squig c"></i>
      <i class="geo tri"></i><i class="geo dot"></i><i class="geo zap"></i>
      <b class="sign">BAYSIDE HIGH</b>
    </div>
    <div class="world" data-vibe="court">
      <i class="crowd"></i>
      <i class="court-floor"></i>
      <i class="flame l"></i><i class="flame r"></i>
      <b class="sign">HE'S ON FIRE</b>
    </div>
    <div class="world" data-vibe="fad">
      <i class="star a"></i><i class="star b"></i><i class="star c"></i><i class="star d"></i>
      <b class="sign">THE TOY AISLE</b>
    </div>
  </div>

  <header class="top">
    <strong>NOSTALMANAC</strong>
    <span class="top-btns">
      <button type="button" id="btnSearch">Search</button>
      <button type="button" id="btnMute">SOUND ON</button>
    </span>
  </header>

  <main id="stage">
    <figure id="sticker">
      <img id="art" alt="" referrerpolicy="no-referrer">
      <span id="stickerTag">CARTOON</span>
    </figure>
    <footer class="copy">
      <p id="tag">1994 · CARTOON</p>
      <h1 id="title">Nostalmanac</h1>
      <p id="note">Push play.</p>
      <div class="links">
        <a id="ytLink" href="https://www.youtube.com/" target="_blank" rel="noopener">YouTube</a>
        <a id="wikiLink" href="https://en.wikipedia.org/" target="_blank" rel="noopener">Wikipedia</a>
      </div>
      <p id="nowplay"></p>
      <p id="pos">1 / 1</p>
    </footer>
  </main>

  <button type="button" class="hit left" id="prev" aria-label="Previous"></button>
  <button type="button" class="hit right" id="next" aria-label="Next"></button>

  <div id="wipe" aria-hidden="true">
    <canvas id="wipeFx"></canvas>
    <div class="scratch-disc"></div>
    <b id="wipeWord">STATIC</b>
  </div>

  <div id="connect">
    <canvas id="bootFx"></canvas>
    <div class="connect-card">
      <p>WELCOME</p>
      <h1>NOSTALMANAC</h1>
      <div class="modem-line">
        <span id="bootStatus">Tap to connect at 28,800 bps</span>
        <i class="modem-bar"><i id="bootFill"></i></i>
      </div>
      <b>Tap anywhere to enter</b>
    </div>
  </div>

  <div id="drawer" hidden inert>
    <div class="sheet">
      <div class="sheet-head">
        <strong>Dig the crates</strong>
        <button type="button" id="btnClose">Done</button>
      </div>
      <input id="search" type="search" placeholder="Sonic, Rugrats, Beastie Boys…" autocomplete="off">
      <div class="chips" id="years"></div>
      <div class="chips" id="cats"></div>
      <p class="drawer-count" id="dbCount"></p>
      <ul class="hits" id="results"></ul>
    </div>
  </div>

  <script type="module" src="js/app.js?v=35"></script>
</body>
</html>
