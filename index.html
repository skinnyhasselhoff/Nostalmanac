<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NOSTALMANAC · 90s kid</title>
  <meta name="description" content="Cartoons, movies, songs, and fads. Tap play and live in the 90s.">
  <meta name="theme-color" content="#ff3d00">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://itunes.apple.com">
  <link rel="preconnect" href="https://en.wikipedia.org">
  <link rel="preconnect" href="https://api.tvmaze.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bangers&family=Outfit:wght@600;800&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=32">
</head>
<body data-vibe="toon">
  <audio id="bed" playsinline webkit-playsinline loop preload="auto" src="audio/silence.wav"></audio>

  <div id="worlds" aria-hidden="true">
    <div class="world is-on" data-vibe="toon">
      <i class="slime"></i><i class="slime s2"></i><i class="splat a"></i><i class="splat b"></i><i class="splat c"></i>
      <b class="sign">SATURDAY MORNING</b>
    </div>
    <div class="world" data-vibe="movie">
      <i class="sprocket"></i><i class="marquee"></i>
      <b class="sign">BE KIND REWIND</b>
    </div>
    <div class="world" data-vibe="jam">
      <i class="vinyl"></i><i class="vinyl v2"></i>
      <b class="sign">YO! MTV RAPS</b>
    </div>
    <div class="world" data-vibe="fad">
      <i class="star a"></i><i class="star b"></i><i class="star c"></i><i class="star d"></i>
      <b class="sign">THE TOY AISLE</b>
    </div>
  </div>

  <header class="top">
    <strong>NOSTALMANAC</strong>
    <span class="top-btns">
      <button type="button" id="btnSearch">Search</button>
      <button type="button" id="btnMute">SOUND ON</button>
    </span>
  </header>

  <main id="stage">
    <figure id="sticker">
      <img id="art" alt="" referrerpolicy="no-referrer">
      <span id="stickerTag">CARTOON</span>
    </figure>
    <footer class="copy">
      <p id="tag">1994 · CARTOON</p>
      <h1 id="title">Nostalmanac</h1>
      <p id="note">Push play.</p>
      <div class="links">
        <a id="ytLink" href="https://www.youtube.com/" target="_blank" rel="noopener">YouTube</a>
        <a id="wikiLink" href="https://en.wikipedia.org/" target="_blank" rel="noopener">Wikipedia</a>
      </div>
      <p id="nowplay"></p>
      <p id="pos">1 / 1</p>
    </footer>
  </main>

  <button type="button" class="hit left" id="prev" aria-label="Previous"></button>
  <button type="button" class="hit right" id="next" aria-label="Next"></button>

  <div id="wipe" aria-hidden="true">
    <canvas id="wipeFx"></canvas>
    <div class="scratch-disc"></div>
    <b id="wipeWord">STATIC</b>
  </div>

  <div id="boot">
    <button type="button" id="playBtn">
      <span class="tri"></span>
      <b>PUSH PLAY</b>
      <small>cartoons · movies · songs · fads</small>
    </button>
  </div>

  <div id="drawer" hidden inert>
    <div class="sheet">
      <div class="sheet-head">
        <strong>Dig the crates</strong>
        <button type="button" id="btnClose">Done</button>
      </div>
      <input id="search" type="search" placeholder="Beastie Boys, Rugrats, Pogs…" autocomplete="off">
      <div class="chips" id="years"></div>
      <div class="chips" id="cats"></div>
      <p class="drawer-count" id="dbCount"></p>
      <ul class="hits" id="results"></ul>
    </div>
  </div>

  <script type="module" src="js/app.js?v=32"></script>
</body>
</html>
